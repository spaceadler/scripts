# Which compose stacks should be running. Read by:
#   zz-script_backup.sh   turns everything off, copies, then brings ON back
#   zy-script_updater.sh  pulls and recreates ON stacks, leaves the rest alone
#
# Folder names relative to ~/homelab/containers. ON is also the start order:
# DNS, the reverse proxy and the website first.
# A stack in neither list is left as it was, with a warning.

ON_STACKS=(
	pihole
	nginx
	spaceadler.com
	4get
	adleros
	airtrail
	audiobookshelf
	beszel/agent
	beszel/server
	bookstack
	cryptpad
	dawarich
	firefox
	ghostfolio
	gitea
	glance
	globnotes
	immich
	jdownloader
	karakeep
	kavita
	kiwix
	maybe
	mealie
	memos
	navidrome
	nomie
	paperless-ngx
	qbittorrent
	radicale
	stremio
	super-productivity
	syncthing
	trek
	vaultwarden
	vikunja
	yamtrack
)

OFF_STACKS=(
	anytype
	docmost
	fluxer
	minecraft
	ollama
	openspeedtest
	searxng
	speedtest
)

# Compose profiles to enable per stack (services hidden behind 'profiles:')
declare -A STACK_PROFILES=(
	[spaceadler.com]="publish"     # cloudflared tunnel
)
